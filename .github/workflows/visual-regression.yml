name: Academic site browser checks
on:
  push:
    branches: [main, master, migration/acad-homepage]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:template
      - run: npm run test:cloth
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:visual
      - name: Upload review screenshots and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-site-preview
          path: |
            output/playwright/
            test-results/
