services:
  jekyll:
    build: .
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/srv/jekyll:ro
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:8080/')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
