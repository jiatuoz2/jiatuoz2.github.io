<figure class="research-cycle">
  <svg viewBox="0 0 480 425" role="img" aria-labelledby="research-cycle-title research-cycle-description">
    <title id="research-cycle-title">Sensing, sensemaking, and interaction form a continuous loop</title>
    <desc id="research-cycle-description">
      Sensing captures signals from people and their surroundings. Sensemaking understands those signals. Interaction uses that understanding to
      respond, producing new signals that return to sensing. People and their context remain at the center.
    </desc>
    <defs>
      <marker id="research-cycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M1 1L9 5L1 9" fill="none" stroke="#8d7535" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </marker>
    </defs>
    <g class="research-cycle-paths" aria-hidden="true">
      <path d="M305 123C349 145 377 184 380 218" />
      <path d="M345 345C286 402 194 402 136 345" />
      <path d="M99 218C102 181 137 148 176 122" />
    </g>
    <g aria-hidden="true">
      <text class="research-cycle-flow" x="382" y="164" text-anchor="middle">Signals</text>
      <text class="research-cycle-flow" x="240" y="404" text-anchor="middle">Understanding</text>
      <text class="research-cycle-flow research-cycle-return" x="69" y="164" text-anchor="middle">New signals</text>
    </g>
    <g class="research-cycle-center" aria-hidden="true">
      <circle cx="240" cy="249" r="51" />
      <text x="240" y="244" text-anchor="middle">People</text>
      <text x="240" y="264" text-anchor="middle">in context</text>
    </g>
    <g class="research-cycle-node research-cycle-node--sensing" aria-hidden="true">
      <ellipse cx="240" cy="82" rx="78" ry="62" />
      <text class="research-cycle-phase" x="240" y="78" text-anchor="middle">Sensing</text>
      <text class="research-cycle-caption" x="240" y="102" text-anchor="middle">Capture signals</text>
    </g>
    <g class="research-cycle-node research-cycle-node--sensemaking" aria-hidden="true">
      <ellipse cx="382" cy="290" rx="78" ry="62" />
      <text class="research-cycle-phase" x="382" y="286" text-anchor="middle">Sensemaking</text>
      <text class="research-cycle-caption" x="382" y="310" text-anchor="middle">Understand signals</text>
    </g>
    <g class="research-cycle-node research-cycle-node--interaction" aria-hidden="true">
      <ellipse cx="98" cy="290" rx="78" ry="62" />
      <text class="research-cycle-phase" x="98" y="286" text-anchor="middle">Interaction</text>
      <text class="research-cycle-caption" x="98" y="310" text-anchor="middle">Adaptive response</text>
    </g>
  </svg>
  <figcaption>A continuous cycle of sensing, understanding, and responding.</figcaption>
</figure>
