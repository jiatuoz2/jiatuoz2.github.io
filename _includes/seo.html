{% capture page_title %}{% if page.title and page.title != '' %}{{ page.title }} | {% endif %}{{ site.title }}{% endcapture %}
<title>{{ page_title | strip | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip | escape }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="en_US" />
<meta property="og:site_name" content="{{ site.title | escape }}" />
<meta property="og:title" content="{{ page_title | strip | escape }}" />
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip | escape }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{{ site.author.avatar | absolute_url }}" />
<meta name="twitter:card" content="summary" />
