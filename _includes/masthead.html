<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <button type="button" aria-label="More navigation links" aria-expanded="false" aria-controls="overflow-navigation">
          <div class="navicon" aria-hidden="true"></div>
        </button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="{{ '/' | relative_url }}">Charlie Zou</a></li>
          {% for link in site.data.navigation.main %}
          <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul id="overflow-navigation" class="hidden-links hidden"></ul>
      </nav>
    </div>
    <button type="button" class="theme-toggle" role="switch" aria-checked="false" aria-label="Night mode" data-theme-toggle>
      <span class="theme-toggle__thumb" aria-hidden="true">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" focusable="false">
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1.5a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zM2.5 11h2a1 1 0 0 1 0 2h-2a1 1 0 0 1 0-2zm17 0h2a1 1 0 0 1 0 2h-2a1 1 0 0 1 0-2zM5.2 3.8l1.4 1.4a1 1 0 0 1-1.4 1.4L3.8 5.2a1 1 0 0 1 1.4-1.4zm13.6 13.6 1.4 1.4a1 1 0 0 1-1.4 1.4l-1.4-1.4a1 1 0 0 1 1.4-1.4zM20.2 3.8a1 1 0 0 1 0 1.4l-1.4 1.4a1 1 0 0 1-1.4-1.4l1.4-1.4a1 1 0 0 1 1.4 0zM6.6 17.4a1 1 0 0 1 0 1.4l-1.4 1.4a1 1 0 0 1-1.4-1.4l1.4-1.4a1 1 0 0 1 1.4 0z"
          />
        </svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" focusable="false">
          <path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a.8.8 0 0 0-1-1A10 10 0 1 0 21.5 15.6a.8.8 0 0 0-1-1z" />
        </svg>
      </span>
    </button>
  </div>
</div>
