# "My Journey" map and detective boards on the homepage (_includes/journey.html).
# Facts come from assets/pdf/cv.pdf, _bibliography/papers.bib, _pages/about.md, the papers'
# PDFs in assets/pdf/ (the study hardware: a Meta Quest 3 with two controllers in VR Task
# Guidance, Bimanual and Delegate the Details; OLIVE's Varjo XR-3, eye tracking at 200 Hz,
# and B-Alert X24 EEG, 20 electrodes at 256 Hz; Cascade's 120 Hz Tobii eye tracking came
# from its rejected UIST submission, which is deliberately not kept in the repo), and what
# Jiatuo has stated directly
# (Hangzhou before 2017; Westminster Academy, Fort Lauderdale, 2017-2021, salutatorian of
# the class of 2021, FRC Team 744 in the 2019 and 2020 seasons; the 2020 competition was
# cancelled because of COVID-19; OLIVE's Varjo XR-3 was used with Valve Index controllers,
# not pictured, and its EEG was recorded through the disposable B-Alert sensor strip; the
# EIT + IMU project did not use the IMU breakout board once shown, so it has no artifact).
# Keep them in step with those sources rather than adding new claims here.
#
# stops: chronological. The map draws a route through them in this order and dims older
#   legs. lat/lon are decimal degrees. year is the short label on the timeline. start/end
#   are YYYY-MM, or a quoted "YYYY" when only the year is known (start may be blank when
#   unknown). current: true marks where I am now. tz is the IANA time zone of the current
#   stop, for the clock on the map (without it the map shows local solar time).
# docs: the documents pinned to that stop's board, in reading order. A stack sits where its
#   first doc appears.
#   kind        place | education | lab | project | paper | person | course | work |
#               award | note | photo | artifact
#   title/meta  heading and one-line context; for a photo, a short caption and the place
#   dates, body optional date line and short description
#   link        absolute URL, site path (/...), or same-page anchor (#paper-<bibtex key>)
#   image       optional picture (site path); image_alt describes it. image_fit: contain
#               shows a tall picture on white whole, as an upright print (default: cropped).
#   image_pixel a pixelated stand-in for a photo of people (site path, <image>.pixel.jpg, made
#               by bin/build_journey_pixelated.py): the board shows it in place of the image;
#               the close-examine view shows the image itself (for the team photo, with every
#               face but Jiatuo's already has a black bar over the eyes in it).
#               Every photo and artifact doc has one: an item that needs a picture but
#               has none is left out, never shown as a text-only card.
#   credit      required for any picture not made by Jiatuo: "Author, License" (or the
#               source, for the few pictures used with permission; see CREDITS.md)
#   credit_link the picture's source page (for licensing); see assets/img/journey/CREDITS.md
#   stamp       short rubber-stamp text (venue, status)
#   stack       id of a stack on this board; stacked docs share one pin and fan out on click
#   medium      how the doc is presented. artifact: cutout (the only kind to use: a PNG
#               with a transparent background and a clean edge, the object lying on the
#               paper under its own shadow). An object with no clean cutout is left out;
#               don't use photo or the legacy bag for artifacts. note: sticky | notebook.
#   attach      id of another doc on this board; the doc is drawn on that one, over its
#               bottom edge or a lower corner, and moves with it (it is not a separate
#               item and takes no stack). No tape, pin or string holds an artifact.
#   model       artifacts only, optional: a 3D model of the object made from a photo of it,
#               or a manufacturer's own model of it adapted to the photo (the Pixel Watch)
#               (glTF binary, assets/models/journey/<doc id>.glb: +Y up, front +Z, centred).
#               The board keeps the cutout; the examine window opens on the cutout too,
#               with a "See 3D model" button that loads the model (three.js, only then),
#               cross-fades to it and lets it be turned freely ("Show photo" goes back).
#               Leave it out when the model does not look real (a melted blob, a toy): the
#               cutout alone is better.
#   scale       artifacts only, optional (0.3-1, default 1): how large the object is drawn on
#               its paper and in the examine window, against the usual size. A hand-held
#               device (the Linktop monitor) is 0.6; a robot keeps 1. Objects that can lie
#               side by side keep their real proportions: the New York headsets (about 20
#               cm across) are 0.7 (Varjo XR-3) and 0.8 (the Quest 3 with its controllers),
#               and OLIVE's EEG strip (about 30 cm long) is 1.
#   model_size_m  with a model: the object's real longest side in metres (its scale, so
#               its shadows and lighting read true)
#   model_yaw   its resting turn in degrees (default -20, the front turned a little toward
#               the lamp at the upper left; positive turns the front to the viewer's right)
#   model_pitch how far above the table it is seen at rest, in degrees (default 16; 0 to
#               75). Set both so the model at rest is seen as the cutout's photo shows it:
#               the window cross-fades from the cutout to the model in that pose, fitted to
#               the cutout's outline, so its first frame is the photo. Find them with
#               bin/fit_journey_model_pose.js (it prints the pose whose silhouette best
#               matches the cutout's).
#   model_pitch_min  optional: how low a visitor may tip the view, in degrees (default 0,
#               level with the table; -35 to 70). Raise it to keep a generated underside
#               out of sight.
#   model_fov   optional: the viewer's lens, its vertical field of view in degrees
#               (default 20, a long lens as product photos are taken; 10 to 50). A photo
#               taken close up shows more perspective (the 2019 robot's frame narrows
#               toward the top): give it a wider lens, fitted with the pose
#               (bin/fit_journey_model_pose.js --fov), so the first frame still matches.
#   model_note  optional, for a model not made from the photo: the note under the model in
#               the examine window (default "This 3D model was reconstructed from a photo
#               and may not be accurate."); say where it came from and that it may differ
#               from the real object (the Pixel Watch's is Google's own product model)
#   model_kicker  optional, with model_note: the kicker while the model shows (default
#               "Object, 3D model from a photo"), e.g. "Object, 3D model"
#   scan_kind   the doc is a real document: diploma (a scan of the diploma itself) |
#               paper-page (a paper's first page, printed) | cover (a closed diploma cover
#               with a plain typed label, for a diploma with no scan yet)
#   scan        the scan (site path, assets/img/journey/docs/<doc id>.jpg); scan_alt
#               describes it; scan_width/scan_height are its pixel size. Without a scan, a
#               diploma or paper-page uses the doc's image; a cover needs none.
#   scan_large  optional: the same page rendered large (<doc id>-large.jpg, about 2600-3600
#               px wide), loaded only by the close-examine view, which swaps it in once it
#               has decoded so the page stays sharp at 250%
#   scan_label  the typed label on a cover (default: the title)
#   portrait    person docs only: a head-and-shoulders photo of that person (site path,
#               assets/img/journey/people/<name>.jpg, square, about 400 px). It is drawn
#               pixelated on the board (portrait_pixel) and shown only on request, by
#               "Reveal photo" in the close-examine view.
#               portrait_alt describes it. Use only an openly licensed photo or one from the
#               person's own official profile (lab or university page, personal homepage);
#               never social media or news photos. No suitable photo: leave it out.
#   portrait_pixel        the portrait's pixelated stand-in (people/<name>.pixel.jpg, made by
#                         bin/build_journey_pixelated.py): shown on the board, and in the
#                         close-examine view until the visitor presses "Reveal photo"
#   portrait_credit       the full credit line, shown as is: "Photo: <source page title>"
#                         for a profile photo, or "Photo: Author, License"
#   portrait_credit_link  the page the photo comes from (see CREDITS.md)
#   Scans are Jiatuo's own documents and papers (no credit row needed); only a paper's first
#   page, or the page that is the diploma itself (page 2 of the UIUC eDiploma PDF, whose page
#   1 is the registrar's cover sheet), never a page with a registrar's details.
# artifact: a physical object tied to the work (a device it ran on, a sensor it read).
#   The picture shows that kind of object, not Jiatuo's own unit, unless Jiatuo supplied
#   it (the two FRC Team 744 robots are cut out of Jiatuo's own photos). Name a model only
#   when the CV, a paper or Jiatuo names it (the Linktop health monitor; the Meta Quest 3,
#   Varjo XR-3 and B-Alert X24 of the New York papers); otherwise name the category.
#   Several artifacts may lie on one paper (OLIVE's headset and EEG strip). Never use a
#   drawing, a plain photo or a different model; leave the artifact out instead. A recoloured picture says so
#   in its credit. Pictures live in assets/img/journey/artifacts/, models in
#   assets/models/journey/ (credits in assets/img/journey/CREDITS.md: a model's row names
#   its source photo, that photo's licence, and the generator; an adapted manufacturer's
#   model, its source and what was changed).
# stacks: piles of related docs under one pin (id, title). Stack ids are unique across all
#   boards (they become page ids). Keep each board to at most nine top-level items
#   (unstacked docs plus stacks; attached docs don't count) so the fixed-size board never
#   overflows.
# threads: red strings between doc ids on the same board; label says how they relate. A
#   thread to a stacked doc attaches to its stack's pin while the stack is closed.

stops:
  - id: hangzhou-early
    name: Hangzhou, China
    short: Hangzhou
    year: "–2017"
    lat: 30.3096
    lon: 120.1435
    start:
    end: "2017"
    period: Before 2017
    headline: Hangzhou, China
    summary: The Daguan area of Gongshu District, Hangzhou, before leaving for high school in the United States in 2017.
    docs:
      - id: hangzhou-early-place
        kind: place
        title: Hangzhou, China
        meta: Daguan area, Gongshu District · before 2017
        body: Home until 2017. Daguan, “the great pass”, is named for Beixinguan, the Ming-dynasty customs pass on the Grand Canal here.
        image: /assets/img/journey/hangzhou-early-grand-canal-daguan.jpg
        image_alt: A wide, calm canal runs straight ahead between banks of willows and dense trees under an overcast sky, with apartment towers far in the distance.
        credit: 方的1P, CC BY-SA 4.0, cropped
        credit_link: https://commons.wikimedia.org/wiki/File:Grand_Canal_from_the_Daguan_Bridge.jpg
      - id: hangzhou-early-gongchen
        kind: photo
        title: Gongchen Bridge on the Grand Canal
        meta: Gongshu District, Hangzhou
        body: A three-arched stone bridge, first built in 1631 and rebuilt in 1885; it marks the end of the Grand Canal in Hangzhou.
        image: /assets/img/journey/hangzhou-early-gongchen-bridge.jpg
        image_alt: A long three-arched stone bridge spans the wide canal, with a moored white boat on the left and new apartment towers and cranes behind.
        credit: Zhangzhugang, CC BY-SA 4.0
        credit_link: https://commons.wikimedia.org/wiki/File:Hangzhou_Gongchen_Qiao_2015.08.01_06-52-03.jpg
      - id: hangzhou-early-qiaoxi
        kind: photo
        title: Qiaoxi historic block
        meta: West of Gongchen Bridge
        body: Old canal-side streets restored and opened in 2010, part of the Grand Canal World Heritage Site since 2014.
        image: /assets/img/journey/hangzhou-early-qiaoxi.jpg
        image_alt: A paved lane runs between low white-walled houses and open timber pavilions, with people sitting on benches and autumn trees behind.
        credit: Siyuwj, CC BY-SA 4.0
        credit_link: https://commons.wikimedia.org/wiki/File:%E6%9D%AD%E5%B7%9E%E6%A1%A5%E8%A5%BF%E7%9B%B4%E8%A1%97,_2021-11-13_01.jpg
      - id: hangzhou-early-xiangji
        kind: photo
        title: Xiangji Temple by the canal
        meta: Dadou Road, Gongshu District
        body: Founded in 978 and rebuilt in 2009–2010; one of its two Qing-dynasty stone pagodas survives.
        image: /assets/img/journey/hangzhou-early-xiangji-temple.jpg
        image_alt: A temple hall with red pillars, a grey tiled roof and a gold name plaque stands behind a paved square, flanked by two white stone elephants.
        credit: 猫猫的日记本, CC BY-SA 4.0
        credit_link: https://commons.wikimedia.org/wiki/File:Xiangji_Temple_in_Hangzhou_06_2014-09.JPG
      - id: hangzhou-early-canal-view
        kind: photo
        title: The Grand Canal by West Lake Cultural Square
        meta: Hangzhou
        body: The tall tower on the right is the main building of West Lake Cultural Square, on the canal's bank.
        image: /assets/img/journey/hangzhou-early-canal-view.jpg
        image_alt: Seen from high up, a wide canal runs into the distance under a footbridge, between tree-lined banks and apartment towers, with a tall glass tower narrowing at its waist on the right.
        credit: Jiatuo Zou
    threads:
      - [hangzhou-early-place, hangzhou-early-gongchen, Grand Canal]
