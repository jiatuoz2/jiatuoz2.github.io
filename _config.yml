title: 'Jiatuo "Charlie" Zou'
description: HCI researcher at Northwestern University's SPICE Lab, working on XR, wearable computing, multimodal AI, and novel sensing.
url: https://jiatuoz2.github.io
baseurl: ""
repository: jiatuoz2/jiatuoz2.github.io
timezone: America/Chicago
encoding: utf-8

author:
  name: 'Jiatuo "Charlie" Zou'
  avatar: /assets/img/profile.jpg
  bio: HCI Researcher · SPICE Lab
  location: Evanston, Illinois
  employer: Northwestern University
  email: jz3331@columbia.edu
  googlescholar: https://scholar.google.com/citations?user=0BX8YlUAAAAJ
  github: jiatuoz2
  linkedin: charlie-zou-42b644221
  cv: /assets/pdf/cv.pdf

# Use the existing citation updater, rather than assuming an upstream stats branch.
google_scholar_stats_enabled: false
google_analytics_id:

include: [_pages]
exclude:
  - .agents
  - .bundle
  - .claude
  - .codex
  - .gemini
  - .github
  - .jekyll-cache
  - .sass-cache
  - .tweet-cache
  - AGENTS.md
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - docker
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - bin
  - docs
  - lighthouse_results
  - node_modules
  - output
  - package.json
  - package-lock.json
  - requirements.txt
  - test
  - test-results
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
keep_files: [CNAME, .nojekyll]

markdown: kramdown
highlighter: rouge
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

collections:
  news:
    output: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: [development]
