title: 'Jiatuo "Charlie" Zou'
description: HCI researcher at Northwestern University's SPICE Lab, working on XR, wearable computing, multimodal AI, and novel sensing.
# The address visitors and search engines end up on: GitHub Pages redirects
# jiatuoz2.github.io to this custom domain (the gh-pages branch carries its CNAME).
# Canonical links, Open Graph URLs, the sitemap and robots.txt are all built from it.
url: https://charliezou.com
baseurl: ""
repository: jiatuoz2/jiatuoz2.github.io
timezone: America/Chicago
encoding: utf-8

author:
  name: 'Jiatuo "Charlie" Zou'
  # The name in Chinese, written once here. The profile banner, page titles, descriptions
  # and structured data all read it, so people searching for it can find the site.
  native_name: 邹家拓
  native_name_lang: zh-Hans
  # Other forms people search for or that papers are published under.
  alternate_names: [Jiatuo Zou, Charlie Zou]
  given_name: Jiatuo
  family_name: Zou
  job_title: HCI Researcher
  alumni_of: [Columbia University]
  avatar: /assets/img/profile.jpg
  bio: HCI Researcher · SPICE Lab
  location: Evanston, Illinois
  employer: Northwestern University
  email: jz3331@columbia.edu
  googlescholar: https://scholar.google.com/citations?user=0BX8YlUAAAAJ
  orcid: 0009-0006-4120-444X
  github: jiatuoz2
  linkedin: charlie-zou-42b644221
  cv: /assets/pdf/cv.pdf

# Use the existing citation updater, rather than assuming an upstream stats branch.
google_scholar_stats_enabled: false
google_analytics_id:

# Search-engine ownership checks. Paste only the token (the content="..." value of the
# meta tag each webmaster tool gives you); an empty key prints nothing.
google_site_verification:
bing_site_verification:
baidu_site_verification:

include: [_pages]
exclude:
  - .agents
  - .bundle
  - .claude
  - .codex
  - .gemini
  - .github
  - .jekyll-cache
  - .sass-cache
  - .tweet-cache
  - AGENTS.md
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - docker
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - bin
  - docs
  - lighthouse_results
  - node_modules
  - output
  - package.json
  - package-lock.json
  - requirements.txt
  - test
  - test-results
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
keep_files: [CNAME, .nojekyll]

markdown: kramdown
highlighter: rouge
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

collections:
  news:
    output: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: [development]
